<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">OwnCoding UI, base compartida de interfaces</title>
  <desc id="desc">Representación editorial compacta: métricas verificables y primitivas compartidas; no es una captura de producto.</desc>
  <rect width="1200" height="340" rx="24" fill="#0e1116"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="32" y="32" width="46" height="46" rx="14" fill="#05f19c"/>
    <path d="M46 47h18M46 55h12M46 63h16" stroke="#06271b" stroke-width="3" stroke-linecap="round"/>
    <text x="92" y="51" fill="#f4f6fa" font-size="18" font-weight="750">OwnCoding UI</text>
    <text x="92" y="72" fill="#aab3c2" font-size="12">v0.67.1 · React 18+ · Tailwind CSS 3.4+</text>
    <text x="32" y="134" fill="#f4f6fa" font-size="40" font-weight="750">Una base común.</text>
    <text x="32" y="181" fill="#f4f6fa" font-size="40" font-weight="750">Interfaces que funcionan.</text>
    <text x="32" y="217" fill="#aab3c2" font-size="15">Campos, operaciones y estados con contratos claros.</text>
    <g transform="translate(32 254)" font-size="13" font-weight="700">
      <rect width="138" height="44" rx="13" fill="#063426" stroke="#087a57"/>
      <text x="69" y="28" text-anchor="middle" fill="#7cffc9">598 exports</text>
      <rect x="150" width="138" height="44" rx="13" fill="#18233e" stroke="#35538d"/>
      <text x="219" y="28" text-anchor="middle" fill="#cbd6ff">169 visuales</text>
      <rect x="300" width="138" height="44" rx="13" fill="#25202f" stroke="#624d79"/>
      <text x="369" y="28" text-anchor="middle" fill="#ddc7fa">14 categorías</text>
    </g>
    <g transform="translate(650 32)">
      <rect width="518" height="276" rx="20" fill="#1f2430" stroke="#3e475a"/>
      <text x="24" y="34" fill="#7cffc9" font-size="11" font-weight="700">PRIMITIVAS COMPARTIDAS · MUESTRA EDITORIAL</text>
      <text x="24" y="65" fill="#f4f6fa" font-size="16" font-weight="700">Operación Demo</text>
      <rect x="24" y="80" width="470" height="46" rx="12" fill="#181d27" stroke="#7c879b"/>
      <text x="40" y="109" fill="#d9dee8" font-size="13">Datos proporcionados por la aplicación</text>
      <rect x="24" y="142" width="142" height="44" rx="12" fill="#05f19c"/>
      <text x="95" y="170" text-anchor="middle" fill="#06271b" font-size="13" font-weight="750">Acción principal</text>
      <rect x="178" y="142" width="138" height="44" rx="12" fill="none" stroke="#7c879b"/>
      <text x="247" y="170" text-anchor="middle" fill="#d9dee8" font-size="13">Secundaria</text>
      <rect x="24" y="204" width="470" height="46" rx="12" fill="#18233e" stroke="#35538d"/>
      <text x="40" y="232" fill="#cbd6ff" font-size="12">Fixtures locales. Sin servicios ni resultados inventados.</text>
    </g>
  </g>
</svg>
