<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-labelledby="title desc">
  <title id="title">Preview profesional del PhoneField con Paraguay por defecto</title>
  <desc id="desc">Representación editorial del campo telefónico con bandera de Paraguay, prefijo +595, búsqueda internacional, salida E.164 y estados válido e inválido.</desc>
  <defs>
    <linearGradient id="phoneSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171D" />
      <stop offset="1" stop-color="#171c25" />
    </linearGradient>
  </defs>
  <rect width="1200" height="552" rx="24" fill="#0e1116" />
  <g font-family="Schibsted Grotesk, ui-sans-serif, system-ui, sans-serif">
    <text x="56" y="30" fill="#8FA0FF" font-size="11" font-weight="750">02 · TELÉFONO INTERNACIONAL</text>
    <text x="56" y="64" fill="#f4f6fa" font-size="28" font-weight="750">Paraguay primero. Datos listos para revisar.</text>
    <text x="56" y="88" fill="#aab3c2" font-size="13" font-weight="500">Selección internacional, pegado y salida E.164 · muestra editorial del componente</text>
    <g transform="translate(58 110)">
      <rect width="704" height="410" rx="20" fill="url(#phoneSurface)" stroke="#393E4A" />
      <text x="28" y="41" fill="#d9dee8" font-size="12" font-weight="700">Teléfono</text>
      <rect x="28" y="56" width="648" height="58" rx="15" fill="#14171D" stroke="#7c879b" />
      <rect x="40" y="67" width="130" height="36" rx="10" fill="#242a38" />
      <text x="54" y="91" fill="#f4f6fa" font-size="16">🇵🇾</text>
      <text x="84" y="91" fill="#f4f6fa" font-size="14" font-weight="720">+595</text>
      <path d="m145 81 7 7 7-7" fill="none" stroke="#aab3c2" stroke-width="2" />
      <line x1="184" y1="69" x2="184" y2="101" stroke="#393E4A" />
      <text x="204" y="92" fill="#f4f6fa" font-size="15">981 123 456</text>
      <rect x="28" y="128" width="648" height="210" rx="16" fill="#14171D" stroke="#393E4A" />
      <rect x="42" y="142" width="620" height="42" rx="11" fill="#242a38" stroke="#2340E6" />
      <circle cx="62" cy="163" r="7" fill="none" stroke="#9fb5ff" stroke-width="2" />
      <path d="m67 168 6 6" stroke="#9fb5ff" stroke-width="2" stroke-linecap="round" />
      <text x="84" y="168" fill="#aab3c2" font-size="12">Buscar país, ISO o código</text>
      <rect x="42" y="196" width="620" height="44" rx="11" fill="#063426" />
      <text x="58" y="224" fill="#f4f6fa" font-size="14">🇵🇾  Paraguay</text>
      <text x="642" y="224" fill="#8FA0FF" font-size="12" font-weight="700" text-anchor="end">PY · +595</text>
      <text x="58" y="270" fill="#f4f6fa" font-size="14">🇦🇷  Argentina</text>
      <text x="642" y="270" fill="#aab3c2" font-size="12" text-anchor="end">AR · +54</text>
      <text x="58" y="314" fill="#f4f6fa" font-size="14">🇧🇷  Brasil</text>
      <text x="642" y="314" fill="#aab3c2" font-size="12" text-anchor="end">BR · +55</text>
      <text x="28" y="371" fill="#7f8b9f" font-size="11">Flechas para navegar · Enter para elegir · Escape para cerrar</text>
    </g>
    <g transform="translate(786 110)">
      <rect width="356" height="410" rx="20" fill="url(#phoneSurface)" stroke="#393E4A" />
      <text x="26" y="40" fill="#8FA0FF" font-size="11" font-weight="750" letter-spacing="1.5">SALIDA NORMALIZADA</text>
      <text x="26" y="73" fill="#f4f6fa" font-size="20" font-weight="720">E.164 listo para guardar</text>
      <rect x="26" y="98" width="304" height="92" rx="16" fill="#063426" stroke="#087a57" />
      <text x="44" y="126" fill="#9ed8ba" font-size="10" font-weight="700">RESULTADO VÁLIDO</text>
      <text x="44" y="155" fill="#f4f6fa" font-size="19" font-weight="760">+595981123456</text>
      <text x="44" y="176" fill="#8FA0FF" font-size="10">Lista para guardar</text>
      <rect x="26" y="206" width="304" height="100" rx="16" fill="#31230d" stroke="#76520d" />
      <text x="44" y="234" fill="#fde68a" font-size="10" font-weight="700">ESTADO INVÁLIDO</text>
      <text x="44" y="264" fill="#f4f6fa" font-size="18" font-weight="760">12</text>
      <text x="44" y="287" fill="#fcd34d" font-size="10">El número necesita más dígitos</text>
      <rect x="26" y="326" width="304" height="58" rx="14" fill="#18233e" stroke="#35538d" />
      <text x="44" y="351" fill="#cbd6ff" font-size="11" font-weight="700">También entiende pegado internacional</text>
      <text x="44" y="370" fill="#9aa9c6" font-size="9">+54, +55, 00… actualizan país y prefijo.</text>
    </g>
  </g>
</svg>
