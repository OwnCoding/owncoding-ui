<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Marcas financieras seguras y campo telefónico internacional</title>
  <desc id="desc">Muestra editorial del selector telefónico con Paraguay por defecto y de los modos compacto, horizontal y fallback neutral de las marcas financieras.</desc>
  <rect width="1200" height="680" rx="28" fill="#0e1116"/>
  <g font-family="Schibsted Grotesk, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="58" fill="#8FA0FF" font-size="13" font-weight="700" letter-spacing="2">CONTRATOS ESPECIALIZADOS</text>
    <text x="56" y="99" fill="#f4f6fa" font-size="30" font-weight="760">Teléfono internacional y marcas con procedencia</text>
    <text x="56" y="130" fill="#aab3c2" font-size="14">Las tarjetas financieras usan placeholders neutrales; la galería muestra únicamente assets permitidos o fallbacks explícitos.</text>

    <g transform="translate(56 168)">
      <rect width="520" height="452" rx="24" fill="#14171D" stroke="#393E4A"/>
      <text x="26" y="38" fill="#9fb5ff" font-size="11" font-weight="700" letter-spacing="1.4">PHONEFIELD</text>
      <text x="26" y="74" fill="#f4f6fa" font-size="20" font-weight="720">Paraguay listo. El resto del mundo, buscable.</text>
      <text x="26" y="101" fill="#aab3c2" font-size="12">Bandera · nombre localizado · ISO · DDI · salida E.164</text>
      <text x="26" y="146" fill="#d9dee8" font-size="12" font-weight="650">Teléfono</text>
      <rect x="26" y="158" width="468" height="54" rx="14" fill="#181d27" stroke="#7c879b"/>
      <rect x="38" y="168" width="118" height="34" rx="10" fill="#242a38"/>
      <text x="54" y="190" fill="#f4f6fa" font-size="14">🇵🇾</text>
      <text x="82" y="190" fill="#f4f6fa" font-size="13" font-weight="650">+595</text>
      <path d="m134 183 6 6 6-6" fill="none" stroke="#aab3c2" stroke-width="2"/>
      <line x1="168" y1="170" x2="168" y2="200" stroke="#393E4A"/>
      <text x="187" y="191" fill="#f4f6fa" font-size="14">981 123 456</text>
      <rect x="26" y="230" width="468" height="178" rx="16" fill="#181d27" stroke="#393E4A"/>
      <rect x="40" y="244" width="440" height="38" rx="10" fill="#242a38" stroke="#2340E6"/>
      <circle cx="60" cy="263" r="7" fill="none" stroke="#9fb5ff" stroke-width="2"/>
      <path d="m65 268 6 6" stroke="#9fb5ff" stroke-width="2" stroke-linecap="round"/>
      <text x="82" y="268" fill="#aab3c2" font-size="12">Buscar país o código</text>
      <rect x="40" y="294" width="440" height="44" rx="10" fill="#063426"/>
      <text x="56" y="321" fill="#f4f6fa" font-size="13">🇵🇾  Paraguay</text>
      <text x="458" y="321" fill="#8FA0FF" font-size="12" text-anchor="end">PY · +595</text>
      <text x="56" y="365" fill="#f4f6fa" font-size="13">🇦🇷  Argentina</text>
      <text x="458" y="365" fill="#aab3c2" font-size="12" text-anchor="end">AR · +54</text>
      <text x="56" y="397" fill="#f4f6fa" font-size="13">🇧🇷  Brasil</text>
      <text x="458" y="397" fill="#aab3c2" font-size="12" text-anchor="end">BR · +55</text>
      <text x="26" y="434" fill="#7f8b9f" font-size="11">Navegación por teclado y pegado internacional incluidos.</text>
    </g>

    <g transform="translate(594 168)">
      <rect width="550" height="452" rx="24" fill="#14171D" stroke="#393E4A"/>
      <text x="26" y="38" fill="#8FA0FF" font-size="11" font-weight="700" letter-spacing="1.4">BANCOLOGO · MEDIOPAGOLOGO</text>
      <text x="26" y="74" fill="#f4f6fa" font-size="20" font-weight="720">Compacto e identificable. Horizontal y legible.</text>
      <text x="26" y="101" fill="#aab3c2" font-size="12">Cada entrada declara fuente, estado, fecha y cobertura por variante.</text>

      <text x="26" y="145" fill="#d9dee8" font-size="11" font-weight="700">VARIANTE COMPACTA</text>
      <g transform="translate(26 160)">
        <rect width="92" height="92" rx="20" fill="#242a38" stroke="#7c879b"/>
        <circle cx="46" cy="46" r="26" fill="#063426" stroke="#087a57"/>
        <text x="46" y="52" fill="#8FA0FF" font-size="17" font-weight="780" text-anchor="middle">BA</text>
        <rect x="106" width="92" height="92" rx="20" fill="#242a38" stroke="#7c879b"/>
        <rect x="132" y="20" width="40" height="52" rx="12" fill="#18233e" stroke="#2340E6"/>
        <text x="152" y="52" fill="#b8c8ff" font-size="15" font-weight="780" text-anchor="middle">BB</text>
        <rect x="212" width="92" height="92" rx="20" fill="#242a38" stroke="#7c879b"/>
        <path d="m258 19 27 27-27 27-27-27z" fill="#302540" stroke="#8c65b6"/>
        <text x="258" y="52" fill="#e3c8ff" font-size="15" font-weight="780" text-anchor="middle">BC</text>
      </g>

      <text x="26" y="286" fill="#d9dee8" font-size="11" font-weight="700">VARIANTE HORIZONTAL</text>
      <rect x="26" y="301" width="498" height="64" rx="16" fill="#242a38" stroke="#393E4A"/>
      <circle cx="61" cy="333" r="19" fill="#063426" stroke="#087a57"/>
      <text x="61" y="338" fill="#8FA0FF" font-size="12" font-weight="780" text-anchor="middle">BA</text>
      <text x="94" y="329" fill="#f4f6fa" font-size="14" font-weight="700">Banco de ejemplo</text>
      <text x="94" y="348" fill="#aab3c2" font-size="10">wordmark oficial o fallback documentado</text>
      <rect x="405" y="317" width="96" height="32" rx="16" fill="#073923"/>
      <text x="453" y="337" fill="#80f2b0" font-size="9" font-weight="700" text-anchor="middle">VERIFICADO</text>

      <rect x="26" y="383" width="498" height="42" rx="12" fill="#31230d" stroke="#76520d"/>
      <circle cx="47" cy="404" r="6" fill="#fcd34d"/>
      <text x="64" y="409" fill="#fde68a" font-size="11">Sin permiso confirmado: fallback neutral, nunca un símbolo inventado.</text>
    </g>
  </g>
</svg>
