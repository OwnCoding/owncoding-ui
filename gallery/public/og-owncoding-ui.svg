<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OwnCoding UI</title>
  <desc id="desc">Una base compartida para productos digitales consistentes.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0e1116"/>
      <stop offset=".58" stop-color="#151a23"/>
      <stop offset="1" stop-color="#0b241b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#05f19c"/>
      <stop offset="1" stop-color="#4d7cfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#canvas)"/>
  <circle cx="1140" cy="-45" r="330" fill="#05f19c" opacity=".07"/>
  <circle cx="590" cy="720" r="360" fill="#4d7cfe" opacity=".07"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(76 76)">
      <rect width="76" height="76" rx="22" fill="#1f2430" stroke="#3e475a" stroke-width="2"/>
      <path d="M20 26h36M20 38h24M20 50h31" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
      <text x="100" y="29" fill="#7cffc9" font-size="14" font-weight="760" letter-spacing="2.6">OWNCODING ECOSYSTEM</text>
      <text x="100" y="67" fill="#f4f6fa" font-size="34" font-weight="780">OwnCoding UI</text>
    </g>

    <text x="76" y="258" fill="#f4f6fa" font-size="64" font-weight="790" letter-spacing="-2.4">Una base compartida.</text>
    <text x="76" y="330" fill="#f4f6fa" font-size="64" font-weight="790" letter-spacing="-2.4">Productos más consistentes.</text>
    <text x="76" y="388" fill="#aab3c2" font-size="22">Componentes, patrones y utilidades verificables para el ecosistema OwnCoding.</text>

    <g transform="translate(76 456)" font-size="16" font-weight="720">
      <rect width="142" height="44" rx="22" fill="#062e22" stroke="#087a57"/>
      <text x="71" y="28" fill="#7cffc9" text-anchor="middle">540 exports</text>
      <rect x="156" width="170" height="44" rx="22" fill="#18233e" stroke="#3d5ca3"/>
      <text x="241" y="28" fill="#b8c8ff" text-anchor="middle">146 visuales</text>
      <rect x="340" width="170" height="44" rx="22" fill="#25202f" stroke="#624d79"/>
      <text x="425" y="28" fill="#ddc7fa" text-anchor="middle">14 categorías</text>
    </g>
    <text x="76" y="560" fill="#7f8b9f" font-size="17">controlaria.online</text>

    <g transform="translate(884 152)" filter="url(#shadow)">
      <rect width="224" height="296" rx="54" fill="#1f2430" stroke="#3e475a" stroke-width="3"/>
      <path d="M57 100h110M57 148h74M57 196h94" fill="none" stroke="url(#accent)" stroke-width="22" stroke-linecap="round"/>
    </g>
  </g>
</svg>
